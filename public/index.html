<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BATU Security Project</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #6366f1; --secondary: #a855f7; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --success: #10b981; --error: #ef4444; }
        body { font-family: 'Segoe UI', sans-serif; background: radial-gradient(circle at top right, #1e1b4b, #0f172a); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 20px; }
        .container { background: var(--card); padding: 2rem; border-radius: 24px; width: 100%; max-width: 480px; border: 1px solid rgba(255,255,255,0.1); }
        .header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; }
        button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: linear-gradient(to right, var(--primary), var(--secondary)); color: white; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .nav { display: flex; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .nav span { cursor: pointer; font-size: 0.85rem; color: #94a3b8; }
        .nav span.active { color: var(--primary); font-weight: bold; border-bottom: 2px solid var(--primary); }
        .status-box { display: none; text-align: center; margin-bottom: 15px; }
        .msg-card { background: #0f172a; padding: 12px; border-radius: 12px; margin-top: 10px; border-left: 4px solid var(--secondary); font-size: 0.85rem; }
        .cipher { font-family: monospace; color: #f59e0b; background: rgba(0,0,0,0.3); padding: 5px; display: block; margin: 5px 0; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="font-size: 0.7rem; color: #94a3b8; font-weight: bold; letter-spacing: 1px;">BATU UNIVERSITY</div>
            <div style="color: var(--primary); font-weight: bold; font-size: 1.2rem;">Tech Tower Team</div>
        </div>

        <div id="status-box" class="status-box"><i id="status-icon" style="font-size: 2rem;"></i><div id="status-text"></div></div>

        <div id="auth-ui">
            <h3 style="text-align:center">Secure Access</h3>
            <input type="text" id="user" placeholder="Username">
            <input type="password" id="pass" placeholder="Password">
            <button onclick="handleAuth('register')">Create Account</button>
            <button onclick="handleAuth('login')" style="background:none; border:1px solid var(--primary);">Sign In</button>
        </div>

        <div id="main-ui" style="display:none;">
            <div class="nav">
                <span id="t-chat" class="active" onclick="showSection('chat')"><i class="fas fa-comment"></i> Chat</span>
                <span id="t-prof" onclick="showSection('prof')"><i class="fas fa-user"></i> Profile</span>
                <span onclick="location.reload()" style="margin-left:auto; color:var(--error)"><i class="fas fa-power-off"></i></span>
            </div>
            
            <div id="s-chat">
                <input type="text" id="to" placeholder="Recipient Username">
                <textarea id="msg" placeholder="Your secret message..."></textarea>
                <button onclick="send()">Send Encrypted</button>
                <h5 style="color:var(--secondary); margin-top:20px;">Incoming Messages</h5>
                <div id="inbox"></div>
            </div>

            <div id="s-prof" style="display:none;">
                <div style="background:rgba(99,102,241,0.1); padding:15px; border-radius:12px; margin-bottom:15px; border: 1px dashed var(--primary);">
                    <div><b>User ID:</b> <span id="p-id"></span></div>
                    <div><b>Username:</b> <span id="p-name"></span></div>
                </div>
                <h5 style="color:var(--primary)">Sent Encryption Log</h5>
                <div id="sent-log"></div>
            </div>
        </div>
    </div>

    <script>
        let me = null;
        const crypt = (t, s) => t.split('').map(c => String.fromCharCode(c.charCodeAt(0) + s)).join('');
        
        function notify(m, type) {
            const b = document.getElementById('status-box');
            document.getElementById('status-icon').className = type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle';
            document.getElementById('status-icon').style.color = type === 'success' ? 'var(--success)' : 'var(--error)';
            document.getElementById('status-text').innerText = m;
            document.getElementById('status-text').style.color = type === 'success' ? 'var(--success)' : 'var(--error)';
            b.style.display = 'block'; setTimeout(() => b.style.display = 'none', 2000);
        }

        async function handleAuth(type) {
            const res = await fetch(`/api/${type}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: document.getElementById('user').value, password: document.getElementById('pass').value})
            });
            const data = await res.json();
            if(res.ok) {
                if(type === 'register') { notify("Account Created!", "success"); }
                else {
                    me = data;
                    document.getElementById('auth-ui').style.display = 'none';
                    document.getElementById('main-ui').style.display = 'block';
                    document.getElementById('p-id').innerText = data.id;
                    document.getElementById('p-name').innerText = data.username;
                    notify("Welcome!", "success");
                    load();
                }
            } else { notify(data.error || "Error", "error"); }
        }

        function showSection(s) {
            document.getElementById('s-chat').style.display = s === 'chat' ? 'block' : 'none';
            document.getElementById('s-prof').style.display = s === 'prof' ? 'block' : 'none';
            document.getElementById('t-chat').className = s === 'chat' ? 'active' : '';
            document.getElementById('t-prof').className = s === 'prof' ? 'active' : '';
            if(s === 'prof' || s === 'chat') load();
        }

        async function send() {
            const text = document.getElementById('msg').value;
            const to = document.getElementById('to').value;
            if(!text || !to) return notify("Fill all fields", "error");
            await fetch('/api/send', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({sender_id: me.id, receiver_username: to, ciphertext: crypt(text, 3)})
            });
            notify("Sent Encrypted!", "success");
            document.getElementById('msg').value = "";
            load();
        }

        async function load() {
            const res = await fetch('/api/all-data');
            const data = await res.json();
            let inH = "", sentH = "";
            data.messages.forEach(m => {
                if(m.receiver === me.username) inH += `<div class="msg-card"><b>From:</b> ${m.sender}<span class="cipher">${m.ciphertext}</span><button onclick="this.previousSibling.innerText='${crypt(m.ciphertext, -3)}';this.remove()" style="background:none; border:1px solid var(--success); color:var(--success); font-size:0.7rem; cursor:pointer; border-radius:4px; padding:2px 5px;">Decrypt</button></div>`;
                if(m.sender === me.username) sentH += `<div class="msg-card" style="border-left-color: var(--primary)"><b>To:</b> ${m.receiver}<br><b>Cipher:</b> <span class="cipher">${m.ciphertext}</span></div>`;
            });
            document.getElementById('inbox').innerHTML = inH || "No messages.";
            document.getElementById('sent-log').innerHTML = sentH || "No history.";
        }
    </script>
</body>
</html>
