<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BATU Security Project</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #6366f1; --secondary: #a855f7; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --success: #10b981; --error: #ef4444; }
        body { font-family: 'Segoe UI', sans-serif; background: radial-gradient(circle at top right, #1e1b4b, #0f172a); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0; padding: 20px; }
        .container { background: var(--card); padding: 2rem; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); width: 100%; max-width: 450px; border: 1px solid rgba(255,255,255,0.1); position: relative; }
        .header-info { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
        .university-name { font-size: 0.7rem; color: #94a3b8; font-weight: bold; letter-spacing: 1.5px; }
        .team-name { color: var(--primary); font-size: 1.1rem; margin-top: 5px; font-weight: bold; }
        
        input, textarea { width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(to right, var(--primary), var(--secondary)); color: white; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { transform: translateY(-2px); opacity: 0.9; }
        
        /* Status Icons Styling */
        .status-container { display: none; text-align: center; margin-bottom: 15px; animation: slideDown 0.4s; }
        .status-container i { font-size: 2.5rem; margin-bottom: 5px; }
        .status-text { font-size: 0.9rem; font-weight: 500; }
        
        .msg-card { background: #0f172a; padding: 15px; border-radius: 12px; margin-top: 10px; border-left: 4px solid var(--secondary); }
        .cipher-text { font-family: monospace; color: #f59e0b; word-break: break-all; display: block; margin-top: 5px; }
        .decrypt-btn { background: transparent; color: var(--success); border: 1px solid var(--success); font-size: 0.7rem; width: auto; padding: 4px 8px; margin-top: 8px; }

        .footer { margin-top: 20px; text-align: center; font-size: 0.75rem; color: #64748b; }
        .footer b { color: var(--secondary); }

        #admin-section { max-width: 1000px; width: 100%; display: none; background: var(--card); padding: 30px; border-radius: 24px; }
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.85rem; }
        .admin-table th, .admin-table td { padding: 12px; border: 1px solid #334155; text-align: left; }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <div class="header-info">
            <div class="university-name">BORG AL ARAB TECHNOLOGICAL UNIVERSITY (BATU)</div>
            <div class="team-name"><i class="fas fa-bolt"></i> Tech Tower Team</div>
        </div>

        <div id="status-box" class="status-container">
            <i id="status-icon"></i>
            <div id="status-text" class="status-text"></div>
        </div>

        <div id="auth-section">
            <h3 style="text-align:center;"><i class="fas fa-user-lock"></i> Secure Access</h3>
            <input type="text" id="user" placeholder="Username">
            <input type="password" id="pass" placeholder="Password">
            <button onclick="auth('register')"><i class="fas fa-user-plus"></i> Create Account</button>
            <button onclick="auth('login')" style="background:transparent; border: 1px solid var(--primary);"><i class="fas fa-sign-in-alt"></i> Sign In</button>
        </div>

        <div id="chat-section" style="display:none;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h4 id="welcome-msg"></h4>
                <button onclick="location.reload()" style="width:auto; background:#ef4444; padding: 5px 12px;"><i class="fas fa-power-off"></i></button>
            </div>
            <input type="text" id="to-user" placeholder="Recipient Username">
            <textarea id="msg-input" placeholder="Secret message..."></textarea>
            <button onclick="sendMsg()"><i class="fas fa-paper-plane"></i> Send Encrypted</button>
            <h4 style="margin-top: 25px; color: var(--secondary); border-bottom: 1px solid #334155;">Inbox (Encrypted)</h4>
            <div id="my-messages"></div>
        </div>

        <div class="footer">
            Powered by <b>Tech Tower Team</b>
        </div>
    </div>

    <div id="admin-section">
        <h2 style="text-align:center;"><i class="fas fa-user-shield"></i> Admin Monitor Center</h2>
        <table class="admin-table">
            <thead><tr><th>ID</th><th>Username</th><th>Hash</th></tr></thead>
            <tbody id="users-table-body"></tbody>
        </table>
        <table class="admin-table" style="margin-top:30px;">
            <thead><tr><th>Sender</th><th>Receiver</th><th>Ciphertext</th></tr></thead>
            <tbody id="messages-table-body"></tbody>
        </table>
        <button onclick="location.href='/'" style="width:200px; margin: 20px auto; display: block;">Back to Home</button>
    </div>

    <script>
        let currentUser = null; // البيانات هنا هتمسح مع الريفريش تلقائياً

        function encrypt(t){ return t.split('').map(c => String.fromCharCode(c.charCodeAt(0) + 3)).join(''); }
        function decrypt(t){ return t.split('').map(c => String.fromCharCode(c.charCodeAt(0) - 3)).join(''); }

        // إظهار الأيقونات بدل الـ Alert
        function notify(message, type) {
            const box = document.getElementById('status-box');
            const icon = document.getElementById('status-icon');
            const text = document.getElementById('status-text');
            
            box.style.display = 'block';
            text.innerText = message;
            
            if(type === 'success') {
                icon.className = 'fas fa-check-circle';
                icon.style.color = 'var(--success)';
                text.style.color = 'var(--success)';
            } else {
                icon.className = 'fas fa-exclamation-circle';
                icon.style.color = 'var(--error)';
                text.style.color = 'var(--error)';
            }

            setTimeout(() => { box.style.display = 'none'; }, 2500);
        }

        window.onload = () => {
            if (window.location.pathname === '/admin-dashboard') {
                document.getElementById('main-container').style.display = 'none';
                document.getElementById('admin-section').style.display = 'block';
                loadAdminData();
            }
        };

        async function auth(type) {
            const res = await fetch(`/api/${type}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: document.getElementById('user').value, password: document.getElementById('pass').value})
            });
            const data = await res.json();
            
            if(data.id) {
                currentUser = data;
                notify("Access Granted!", "success");
                setTimeout(() => {
                    document.getElementById('auth-section').style.display = 'none';
                    document.getElementById('chat-section').style.display = 'block';
                    document.getElementById('welcome-msg').innerText = `Hello, ${data.username}`;
                    loadMessages();
                }, 1000);
            } else { 
                notify(data.error || "Action Completed", type === 'register' ? "success" : "error"); 
            }
        }

        async function sendMsg() {
            const text = document.getElementById('msg-input').value;
            const receiver = document.getElementById('to-user').value;
            if(!receiver || !text) return notify("Missing fields", "error");

            await fetch('/api/send', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({sender_id: currentUser.id, receiver_username: receiver, ciphertext: encrypt(text)})
            });
            notify("Encrypted & Sent!", "success");
            document.getElementById('msg-input').value = "";
        }

        async function loadMessages() {
            const res = await fetch('/api/secret-admin-gate');
            const data = await res.json();
            let html = "";
            data.messages.filter(m => m.receiver === currentUser.username).forEach(m => {
                html += `
                <div class="msg-card">
                    <span style="font-size:0.75rem; color:var(--primary)">From: ${m.sender}</span>
                    <span class="cipher-text" id="msg-${m.id}">${m.ciphertext}</span>
                    <button class="decrypt-btn" onclick="document.getElementById('msg-${m.id}').innerText='${decrypt(m.ciphertext)}'">
                        <i class="fas fa-unlock"></i> Decrypt
                    </button>
                </div>`;
            });
            document.getElementById('my-messages').innerHTML = html || "Empty Inbox";
        }

        async function loadAdminData() {
            const res = await fetch('/api/secret-admin-gate');
            const data = await res.json();
            let uHtml = "";
            data.users.forEach(u => { uHtml += `<tr><td>${u.id}</td><td>${u.username}</td><td style="font-size:0.6rem; color:#10b981">${u.password_hash}</td></tr>`; });
            document.getElementById('users-table-body').innerHTML = uHtml;
            let mHtml = "";
            data.messages.forEach(m => { mHtml += `<tr><td>${m.sender}</td><td>${m.receiver}</td><td style="color:#f59e0b">${m.ciphertext}</td></tr>`; });
            document.getElementById('messages-table-body').innerHTML = mHtml;
        }
    </script>
</body>
</html>
