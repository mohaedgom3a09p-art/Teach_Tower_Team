<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BATU Security Project</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #6366f1; --secondary: #a855f7; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --success: #10b981; --error: #ef4444; }
        body { font-family: 'Segoe UI', sans-serif; background: radial-gradient(circle at top right, #1e1b4b, #0f172a); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 20px; }
        .container { background: var(--card); padding: 2rem; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); width: 100%; max-width: 480px; border: 1px solid rgba(255,255,255,0.1); }
        .header-info { text-align: center; margin-bottom: 25px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
        .university-name { font-size: 0.75rem; color: #94a3b8; font-weight: bold; letter-spacing: 1.5px; text-transform: uppercase; }
        .team-name { color: var(--primary); font-size: 1.2rem; margin-top: 5px; font-weight: bold; }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .nav-tabs span { cursor: pointer; padding: 8px 12px; border-radius: 10px; font-size: 0.9rem; transition: 0.3s; color: #94a3b8; display: flex; align-items: center; gap: 8px; }
        .nav-tabs span.active { background: rgba(99, 102, 241, 0.2); color: var(--primary); font-weight: bold; }
        input, textarea { width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(to right, var(--primary), var(--secondary)); color: white; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .status-container { display: none; text-align: center; margin-bottom: 15px; }
        .msg-card { background: #0f172a; padding: 15px; border-radius: 15px; margin-top: 12px; border-left: 4px solid var(--secondary); position: relative; }
        .cipher-text { font-family: monospace; color: #f59e0b; word-break: break-all; display: block; margin: 8px 0; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 8px; }
        .decrypt-btn { background: transparent; border: 1px solid var(--success); color: var(--success); padding: 5px 12px; font-size: 0.75rem; width: auto; margin-top: 5px; border-radius: 8px; cursor: pointer; }
        .footer-tag { text-align: center; margin-top: 25px; font-size: 0.75rem; color: #64748b; border-top: 1px solid #334155; padding-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-info">
            <div class="university-name">Borg Al Arab Technological University (BATU)</div>
            <div class="team-name"><i class="fas fa-bolt"></i> Tech Tower Team</div>
        </div>
        <div id="status-box" class="status-container"><i id="status-icon"></i> <span id="status-text"></span></div>
        
        <div id="auth-section">
            <h3 style="text-align:center;"><i class="fas fa-user-shield"></i> Access Gate</h3>
            <input type="text" id="user" placeholder="Username">
            <input type="password" id="pass" placeholder="Password">
            <button onclick="handleAuth('register')">Create Account</button>
            <button onclick="handleAuth('login')" style="background:transparent; border: 1px solid var(--primary);">Sign In</button>
        </div>

        <div id="app-content" style="display:none;">
            <div class="nav-tabs">
                <span id="tab-chat" class="active" onclick="switchTab('chat')"><i class="fas fa-comment-dots"></i> Chat</span>
                <span id="tab-profile" onclick="switchTab('profile')"><i class="fas fa-id-card"></i> Profile</span>
                <button onclick="location.reload()" style="width:auto; margin:0; padding: 6px 12px; background:#ef4444; margin-left:auto;"><i class="fas fa-power-off"></i></button>
            </div>
            <div id="section-chat">
                <input type="text" id="to-user" placeholder="Recipient">
                <textarea id="msg-input" placeholder="Secret message..."></textarea>
                <button onclick="sendMsg()"><i class="fas fa-paper-plane"></i> Send Encrypted</button>
                <div id="my-messages"></div>
            </div>
            <div id="section-profile" style="display:none;">
                <div class="profile-box">
                    <div><b>ID:</b> <span id="prof-id"></span></div>
                    <div><b>Username:</b> <span id="prof-name"></span></div>
                </div>
                <div id="sent-messages-log"></div>
            </div>
            <div class="footer-tag">Powered by <b>Tech Tower Team</b></div>
        </div>
    </div>

    <script>
        let me = null; const shift = 3;

        // دالة التشفير السليمة 100%
        function crypt(t, s) {
            return t.split('').map(c => String.fromCharCode(c.charCodeAt(0) + s)).join('');
        }

        function notify(m, type) {
            const box = document.getElementById('status-box');
            document.getElementById('status-text').innerText = m;
            const color = type === 'success' ? '#10b981' : '#ef4444';
            document.getElementById('status-icon').style.color = color;
            document.getElementById('status-text').style.color = color;
            box.style.display = 'block'; setTimeout(() => box.style.display = 'none', 2000);
        }

        async function handleAuth(type) {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            const res = await fetch(`/api/${type}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            const data = await res.json();
            if(res.ok) {
                if(type === 'register') notify("Account Created!", "success");
                else {
                    me = data;
                    document.getElementById('auth-section').style.display = 'none';
                    document.getElementById('app-content').style.display = 'block';
                    document.getElementById('prof-id').innerText = data.id;
                    document.getElementById('prof-name').innerText = data.username;
                    load();
                }
            } else notify(data.error, "error");
        }

        function switchTab(t) {
            document.getElementById('section-chat').style.display = t === 'chat' ? 'block' : 'none';
            document.getElementById('section-profile').style.display = t === 'profile' ? 'block' : 'none';
            document.getElementById('tab-chat').className = t === 'chat' ? 'active' : '';
            document.getElementById('tab-profile').className = t === 'profile' ? 'active' : '';
            load();
        }

        async function sendMsg() {
            const t = document.getElementById('msg-input').value;
            const r = document.getElementById('to-user').value;
            if(!t || !r) return notify("Fill fields", "error");
            
            try {
                const encrypted = crypt(t, shift);
                const res = await fetch('/api/send', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({sender_id: me.id, receiver_username: r, ciphertext: encrypted})
                });
                if(res.ok) {
                    notify("Sent!", "success");
                    document.getElementById('msg-input').value = "";
                    load();
                } else {
                    const err = await res.json();
                    notify(err.error, "error");
                }
            } catch(e) { notify("Send Error", "error"); }
        }

        async function load() {
            const res = await fetch('/api/all-data');
            const data = await res.json();
            let inH = "", sentH = "";
            data.messages.forEach(m => {
                if(m.receiver === me.username) {
                    inH += `<div class="msg-card"><small>From: ${m.sender}</small>
                    <span class="cipher-text" id="msg-${m.id}">${m.ciphertext}</span>
                    <button class="decrypt-btn" onclick="document.getElementById('msg-${m.id}').innerText='${crypt(m.ciphertext, -shift)}';this.style.display='none'">Decrypt</button></div>`;
                }
                if(m.sender === me.username) {
                    sentH += `<div class="msg-card">To: ${m.receiver}<br><span class="cipher-text">${m.ciphertext}</span></div>`;
                }
            });
            document.getElementById('my-messages').innerHTML = inH || "Empty";
            document.getElementById('sent-messages-log').innerHTML = sentH || "No history";
        }
    </script>
</body>
</html>
